<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>致慧</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle at 50% 50%, #fffdf7 0%, #fbe8c7 50%, #e6c17a 100%);
            font-family: 'Georgia', serif;
            overflow: hidden;
            color: #5c4033;
        }

        .contenedor-frasco {
            position: relative;
            cursor: pointer;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            display: flex;
            flex-direction: column;
            align-items: center;
            z-index: 10;
        }
        
        .contenedor-frasco:hover {
            transform: scale(1.05) translateY(-5px);
        }

        .corcho {
            width: 65px;
            height: 30px;
            background: linear-gradient(to right, #b5835a, #c89b72, #b5835a);
            border-radius: 6px 6px 3px 3px;
            position: relative;
            top: 8px;
            z-index: 2;
            box-shadow: inset 0 -4px 6px rgba(0,0,0,0.2), 0 2px 5px rgba(0,0,0,0.1);
        }

        .cuello-frasco {
            width: 80px;
            height: 25px;
            background: rgba(255, 255, 255, 0.2);
            border: 2px solid rgba(255, 255, 255, 0.7);
            border-bottom: none;
            border-radius: 8px 8px 0 0;
            position: relative;
            top: 4px;
            z-index: 1;
            backdrop-filter: blur(5px);
            box-shadow: inset 10px 0 10px rgba(255,255,255,0.3);
        }

        .frasco {
            width: 150px;
            height: 200px;
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.4) 0%, rgba(255, 255, 255, 0.1) 100%);
            border: 2px solid rgba(255, 255, 255, 0.6);
            border-radius: 40px 40px 50px 50px;
            backdrop-filter: blur(8px);
            box-shadow: 
                0 20px 40px rgba(180, 130, 50, 0.2), 
                inset 15px 0 20px rgba(255,255,255,0.5),
                inset -10px -10px 20px rgba(255, 255, 255, 0.2);
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .magia {
            width: 70px;
            height: 70px;
            background: radial-gradient(circle, rgba(255, 220, 100, 1) 0%, rgba(255, 180, 50, 0.6) 40%, transparent 70%);
            border-radius: 50%;
            filter: blur(3px);
            animation: flotarLatido 4s ease-in-out infinite;
        }

        @keyframes flotarLatido {
            0%, 100% { transform: translateY(15px) scale(0.9); opacity: 0.8; }
            50% { transform: translateY(-15px) scale(1.15); opacity: 1; }
        }

        .resplandor {
            position: absolute;
            width: 200px;
            height: 200px;
            background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: -1;
        }

        /* Menú de selección */
        .selector {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            background: rgba(255, 252, 245, 0.95);
            padding: 30px;
            border-radius: 15px;
            border: 1px solid rgba(212, 175, 55, 0.5);
            box-shadow: 0 15px 35px rgba(120, 80, 20, 0.2);
            text-align: center;
            z-index: 150;
            opacity: 0;
            pointer-events: none;
            visibility: hidden;
            transition: all 0.3s ease;
        }

        .selector.visible {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .selector h3 {
            margin-top: 0;
            color: #d4af37;
            font-size: 1.2em;
            margin-bottom: 20px;
        }

        .btn-opcion {
            display: block;
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            background: transparent;
            color: #8c6b4a;
            border: 1px solid #c09040;
            border-radius: 20px;
            font-family: inherit;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-opcion:hover {
            background: #c09040;
            color: white;
        }

        /* Tarjeta de papel desplegable */
        .papel {
            position: absolute;
            width: 320px;
            padding: 45px 35px;
            background: #fffcf7; 
            color: #5c4033; 
            border: 1px solid rgba(212, 175, 55, 0.3);
            border-radius: 12px;
            box-shadow: 0 25px 50px rgba(120, 80, 20, 0.15);
            text-align: center;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) scale(0.9);
            opacity: 0;
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 200;
            pointer-events: none;
            visibility: hidden;
        }

        .papel.abierto {
            transform: translate(-50%, -50%) scale(1);
            opacity: 1;
            pointer-events: auto;
            visibility: visible;
        }

        .papel h2 {
            margin-top: 0;
            font-size: 1.8em; 
            border-bottom: 1px solid #f0e6d2;
            padding-bottom: 15px;
            margin-bottom: 25px;
            font-weight: normal;
        }

        .papel p {
            font-size: 1.2em;
            line-height: 1.6;
            font-style: italic;
        }

        .cerrar {
            margin-top: 35px;
            padding: 12px 28px;
            background: transparent;
            color: #c09040;
            border: 1px solid #c09040;
            border-radius: 30px;
            cursor: pointer;
            font-family: inherit;
            font-size: 0.9em;
            letter-spacing: 1px;
            transition: all 0.3s;
        }
        
        .cerrar:hover {
            background: #c09040;
            color: white;
        }

        .notificacion {
            position: absolute;
            top: 40px;
            background: rgba(255, 252, 245, 0.9);
            color: #8c6b4a;
            padding: 12px 25px;
            border-radius: 30px;
            font-size: 1em;
            box-shadow: 0 5px 15px rgba(0,0,0,0.05);
            border: 1px solid rgba(212, 175, 55, 0.2);
            opacity: 0;
            transition: opacity 0.4s ease;
            pointer-events: none;
            z-index: 50;
        }

        /* Botón de reseteo para tus pruebas */
        .btn-test {
            position: absolute;
            bottom: 10px;
            right: 10px;
            background: rgba(0,0,0,0.1);
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            font-size: 10px;
            color: #555;
            cursor: pointer;
            z-index: 999;
        }
        .btn-test:hover { background: rgba(0,0,0,0.2); }
    </style>
</head>

        let temporizadorNotificacion;
        let diasTranscurridosGlobal = 0;
        let fechaClaveHoy = "";

        function mostrarNotificacion(texto) {
            const noti = document.getElementById('notificacion');
            noti.innerText = texto;
            noti.style.opacity = '1';
            clearTimeout(temporizadorNotificacion);
            temporizadorNotificacion = setTimeout(() => { noti.style.opacity = '0'; }, 4000);
        }

        function iniciarApertura() {
            const ahoraStr = new Date().toLocaleString("en-US", {timeZone: ZONA_HORARIA});
            const ahora = new Date(ahoraStr);
            const horaActual = ahora.getHours();
            
            const fechaInicio = new Date(INICIO_ANO, INICIO_MES - 1, INICIO_DIA);
            const fechaHoy = new Date(ahora.getFullYear(), ahora.getMonth(), ahora.getDate());
            
            diasTranscurridosGlobal = Math.floor((fechaHoy - fechaInicio) / (1000 * 60 * 60 * 24));
            
            fechaClaveHoy = `dia_${diasTranscurridosGlobal}`;

            if (diasTranscurridosGlobal < 0) {
                mostrarNotificacion(`El frasco está sellado. Podrás abrirlo el ${INICIO_DIA}/${INICIO_MES}.`);
                return;
            }

            if (horaActual < HORA_DESBLOQUEO) {
                mostrarNotificacion(`Aún están durmiendo las palabras. Vuelve a las ${HORA_DESBLOQUEO}:00 AM.`);
                return;
            }

            const registroHoy = JSON.parse(localStorage.getItem('frasco_registro_hui'));

            if (registroHoy && registroHoy.fecha === fechaClaveHoy) {
                mostrarEnPapel(registroHoy.contenido);
            } else {
                document.getElementById('selector').classList.add('visible');
            }
        }

        function elegirOpcion(tipo) {
            document.getElementById('selector').classList.remove('visible');
            
            let contenido = "";

            if (tipo === 'frase') {
                const indice = diasTranscurridosGlobal % mensajes.length;
                contenido = mensajes[indice];
            } else if (tipo === 'chiste') {
                // Saca un chiste local bilingüe al azar
                const indiceChiste = Math.floor(Math.random() * baseDeDatosChistes.length);
                contenido = baseDeDatosChistes[indiceChiste];
            }
            
            guardarYMostrar(contenido);
        }

        function guardarYMostrar(contenido) {
            const datosHoy = {
                fecha: fechaClaveHoy,
                contenido: contenido
            };
            localStorage.setItem('frasco_registro_hui', JSON.stringify(datosHoy));
            
            mostrarEnPapel(contenido);
        }

        function mostrarEnPapel(contenido) {
            document.getElementById('texto-mensaje').innerHTML = contenido;
            document.getElementById('papel').classList.add('abierto');
        }

        function cerrarSelector(evento) {
            document.getElementById('selector').classList.remove('visible');
            evento.stopPropagation();
        }

        function cerrarPapel(evento) {
            document.getElementById('papel').classList.remove('abierto');
            evento.stopPropagation(); 
        }
